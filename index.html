  // 判断是否为静态case
  function isStaticCase (newdown)
  {
    return [1, 2, 6, 11, 25].includes(newdown);
  }

  // 静态链接生成
  function generateStaticDownloadLink ()
  {
    switch (variables.newdown) {
      case 1:
        return variables.softUrl; // 直接返回 softUrl
      case 2:
        return `${variables.softUrl}?channel=${variables.channelId}&cid=${variables.softId}&referer=${variables.Localhref}`;
      case 6:
        return `${variables.softUrl}/${variables.gameId}_${variables.channelId}_${variables.SemId}.exe`;
      case 11:
        return `${variables.softUrl}_${variables.channelId}_${variables.SemId}.exe`;
      case 25:
        return `https://softmgr.ludashi.com/downloader/soft/url?siteid=${variables.channelId}&softid=${variables.softId}&downname=${variables.downName}&softname=${variables.downName}&downurl=${variables.realurl}&tagid=${variables.Localhost}@@${variables.wordId}&bd_vid=${variables.SemId}`;

      default:
        return variables.softUrl;
    }
  }

  // 动态链接生成
  function generateDynamicDownloadLink (trackNo)
  {
    switch (variables.newdown) {
      case 3:
        return `${variables.softUrl}?tagId=${trackNo}`;
      case 4:
        return `${variables.softUrl}?${variables.softId}=${trackNo}`;
      case 7:
        return `${variables.softUrl}/${variables.gameId}_${variables.channelId}_${trackNo}.exe`;
      case 12:
        return `${variables.softUrl}_${variables.channelId}_${trackNo}.exe`;
      case 13:
        return `https://file.lbs.yyzhsp.com/app/pc/package/${variables.gameId}/setup_${variables.channelId}_${variables.gameId}.exe?${variables.softId}=${variables.SemId}`;
      case 14:
        return `https://file.lbs.yyzhsp.com/app/pc/package/${variables.gameId}/setup_${variables.channelId}_${variables.gameId}.exe?${variables.softId}=${trackNo}`;
      case 33:
        return `${variables.softUrl}?${variables.softId}=${trackNo}`;

      default:
        return variables.softUrl;
    }
  }
